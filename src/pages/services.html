<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA | Service Management</title>

  <link rel="stylesheet" href="../output.css">

  <script src="../js/crud.js" defer></script>
</head>

<body class="min-h-screen bg-gray-50 text-gray-900">

  <header class="bg-gray-950 px-6 py-5 text-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between">
      <a href="../../index.html" class="text-2xl font-bold tracking-wide">
        NOVA
      </a>

      <a href="../../index.html"
         class="rounded-lg border border-gray-600 px-4 py-2 hover:bg-gray-800">
        Back to Home
      </a>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-5 py-10">

    <section class="mb-8">
      <p class="text-sm font-semibold uppercase tracking-widest text-purple-600">
        NOVA Dashboard
      </p>
      <h1 class="mt-2 text-3xl font-bold sm:text-4xl">
        Service Management
      </h1>
      <p class="mt-3 text-gray-600">
        Add, manage, update and search your service records.
      </p>
    </section>

    <section class="mb-10 rounded-2xl border border-gray-200 bg-white p-6 shadow-sm">
      <h2 class="mb-5 text-xl font-bold">Add or Update a Service</h2>

      <form id="serviceForm" class="grid gap-5">

        <div>
          <label for="serviceName" class="mb-2 block font-medium">
            Service Name
          </label>
          <input id="serviceName" type="text" required maxlength="100"
            placeholder="e.g. Website Design"
            class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none focus:border-purple-600">
        </div>

        <div>
          <label for="serviceCategory" class="mb-2 block font-medium">
            Category
          </label>
          <select id="serviceCategory" required
            class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3">
            <option value="">Select a category</option>
            <option value="Web Development">Web Development</option>
            <option value="Graphic Design">Graphic Design</option>
            <option value="AI & Technology">AI & Technology</option>
            <option value="Digital Marketing">Digital Marketing</option>
          </select>
        </div>

        <div>
          <label for="serviceDescription" class="mb-2 block font-medium">
            Description
          </label>
          <textarea id="serviceDescription" required maxlength="500" rows="3"
            placeholder="Describe the service..."
            class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none focus:border-purple-600"></textarea>
        </div>

        <button id="submitButton" type="submit"
          class="rounded-lg bg-purple-700 px-5 py-3 font-semibold text-white hover:bg-purple-800">
          Add Service
        </button>
      </form>
    </section>

    <section>
      <div class="mb-5 flex flex-col justify-between gap-4 sm:flex-row sm:items-end">
        <div>
          <h2 class="text-2xl font-bold">Your Services</h2>
          <p id="recordCount" class="mt-1 text-sm text-gray-500">
            0 records
          </p>
        </div>

        <div class="grid gap-3 sm:grid-cols-2">
          <input id="searchInput" type="search"
            placeholder="Search services..."
            class="rounded-lg border border-gray-300 bg-white px-4 py-3">

          <select id="filterCategory"
            class="rounded-lg border border-gray-300 bg-white px-4 py-3">
            <option value="all">All Categories</option>
            <option value="Web Development">Web Development</option>
            <option value="Graphic Design">Graphic Design</option>
            <option value="AI & Technology">AI & Technology</option>
            <option value="Digital Marketing">Digital Marketing</option>
          </select>
        </div>
      </div>

      <div id="servicesList" class="grid gap-5 md:grid-cols-2">
      </div>
    </section>

  </main>

  <footer class="mt-12 bg-gray-950 px-5 py-6 text-center text-sm text-gray-300">
    © 2026 NOVA. All rights reserved.
  </footer>

</body>
</html>
