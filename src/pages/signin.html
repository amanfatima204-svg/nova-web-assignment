<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova | Sign In</title>
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../output.css">
</head>

<body class="bg-slate-50 text-slate-800">

   <!-- NAVBAR -->
<nav class="bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-6 py-4">

        <div class="flex items-center justify-between">

            <!-- Logo -->
            <a href="../../index.html"
               class="text-2xl font-bold text-indigo-600">
                NOVA
            </a>

            <!-- Desktop Navigation -->
            <div class="hidden md:flex items-center gap-8">

                <a href="../../index.html"
                   class="text-slate-600 hover:text-indigo-600 transition">
                    Home
                </a>

                <a href="about.html"
                   class="text-slate-600 hover:text-indigo-600 transition">
                    About
                </a>

                <a href="contact.html"
                   class="text-slate-600 hover:text-indigo-600 transition">
                    Contact
                </a>

                <a href="signin.html"
                   class="text-indigo-600 font-semibold">
                    Sign In
                </a>

                <a href="signup.html"
                   class="bg-indigo-600 text-white px-5 py-2.5 rounded-lg hover:bg-indigo-700 transition">
                    Sign Up
                </a>

            </div>

            <!-- Mobile Menu -->
            <details class="md:hidden relative">
                <summary class="list-none cursor-pointer px-4 py-2 rounded-lg bg-indigo-600 text-white font-semibold">
                    Menu
                </summary>

                <div class="absolute right-0 top-12 w-48 bg-white border border-slate-200 rounded-lg shadow-lg p-3 z-50">

                    <a href="../../index.html"
                       class="block px-3 py-2 rounded-lg text-slate-600 hover:bg-indigo-50">
                        Home
                    </a>

                    <a href="about.html"
                       class="block px-3 py-2 rounded-lg text-slate-600 hover:bg-indigo-50">
                        About
                    </a>

                    <a href="contact.html"
                       class="block px-3 py-2 rounded-lg text-slate-600 hover:bg-indigo-50">
                        Contact
                    </a>

                    <hr class="my-2 border-slate-200">

                    <a href="signin.html"
                       class="block px-3 py-2 rounded-lg text-indigo-600 font-semibold hover:bg-indigo-50">
                        Sign In
                    </a>

                    <a href="signup.html"
                       class="block px-3 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">
                        Sign Up
                    </a>

                </div>
            </details>

        </div>

    </div>
</nav>


    <!-- SIGN IN SECTION -->
    <main class="min-h-[calc(100vh-80px)] flex items-center justify-center
                 px-6 py-16">

        <div class="w-full max-w-md">

            <!-- Heading -->
            <div class="text-center mb-8">

                <div class="w-16 h-16 mx-auto bg-indigo-100
                            text-indigo-600 rounded-2xl
                            flex items-center justify-center
                            text-3xl mb-5">
                    🔐
                </div>

                <h1 class="text-3xl md:text-4xl font-bold">
                    Welcome Back
                </h1>

                <p class="text-slate-600 mt-3">
                    Sign in to continue to Nova.
                </p>

            </div>


            <!-- SIGN IN CARD -->
            <div class="bg-white rounded-2xl shadow-lg
                        border border-slate-200 p-8">

                <form class="space-y-6">

                    <!-- Email -->
                    <div>
                        <label for="email"
                               class="block text-sm font-semibold mb-2">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                            class="w-full px-4 py-3 rounded-lg
                                   border border-slate-300
                                   focus:outline-none
                                   focus:ring-2 focus:ring-indigo-500">
                    </div>


                    <!-- Password -->
                    <div>
                        <div class="flex justify-between items-center mb-2">

                            <label for="password"
                                   class="block text-sm font-semibold">
                                Password
                            </label>

                            <a href="#"
                               class="text-sm text-indigo-600
                                      hover:text-indigo-700">
                                Forgot password?
                            </a>

                        </div>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                            class="w-full px-4 py-3 rounded-lg
                                   border border-slate-300
                                   focus:outline-none
                                   focus:ring-2 focus:ring-indigo-500">
                    </div>


                    <!-- Remember Me -->
                    <div class="flex items-center gap-2">

                        <input
                            type="checkbox"
                            id="remember"
                            class="w-4 h-4 accent-indigo-600">

                        <label for="remember"
                               class="text-sm text-slate-600">
                            Remember me
                        </label>

                    </div>


                    <!-- Button -->
                    <button
                        type="submit"
                        class="w-full bg-indigo-600 text-white
                               py-3 rounded-lg font-semibold
                               hover:bg-indigo-700 transition">
                        Sign In
                    </button>

                </form>


                <!-- Divider -->
                <div class="flex items-center gap-4 my-7">

                    <div class="h-px bg-slate-200 flex-1"></div>

                    <span class="text-sm text-slate-500">
                        OR
                    </span>

                    <div class="h-px bg-slate-200 flex-1"></div>

                </div>


                <!-- Social Button -->
                <button
                    class="w-full border border-slate-300
                           py-3 rounded-lg font-semibold
                           hover:bg-slate-50 transition">
                    Continue with Google
                </button>


                <!-- Sign Up -->
                <p class="text-center text-sm text-slate-600 mt-7">

                    Don't have an account?

                    <a href="signup.html"
                       class="text-indigo-600 font-semibold
                              hover:text-indigo-700">
                        Sign Up
                    </a>

                </p>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="bg-slate-950 text-slate-300">

        <div class="max-w-7xl mx-auto px-6 py-10">

            <div class="flex flex-col md:flex-row
                        justify-between items-center gap-4">

                <div>
                    <a href="../../index.html"
                       class="text-xl font-bold text-white">
                        NOVA
                    </a>

                    <p class="text-sm text-slate-500 mt-2">
                        Simple. Modern. Digital.
                    </p>
                </div>

                <div class="flex gap-6 text-sm">

                    <a href="../../index.html"
                       class="hover:text-white transition">
                        Home
                    </a>

                    <a href="about.html"
                       class="hover:text-white transition">
                        About
                    </a>

                    <a href="contact.html"
                       class="hover:text-white transition">
                        Contact
                    </a>

                </div>

            </div>

            <div class="border-t border-slate-800 mt-8 pt-6 text-center">

                <p class="text-sm text-slate-500">
                    © 2026 Nova. All rights reserved.
                </p>

            </div>

        </div>

    </footer>

</body>
</html>
