            <!-- Mobile Menu -->

                <summary class="list-none cursor-pointer px-4 py-2 rounded-lg bg-indigo-600 text-white font-semibold">

                </summary>

                <div class="absolute right-0 top-12 w-48 bg-white border border-slate-200 rounded-lg shadow-lg p-3 z-50">

                    <a href="../../index.html"

                    <a href="about.html"

</nav>
 </header>

    <!-- SIGN UP SECTION -->
    <main class="min-h-[calc(100vh-80px)] flex items-center justify-center
                 px-6 py-16">

        <div class="w-full max-w-md">

            <!-- HEADING -->
            <div class="text-center mb-8">

                <div class="w-16 h-16 mx-auto bg-indigo-100
                            text-indigo-600 rounded-2xl
                            flex items-center justify-center
                            text-3xl mb-5">
                    ✨
                </div>

                <h1 class="text-3xl md:text-4xl font-bold">
                    Create Your Account
                </h1>

                <p class="text-slate-600 mt-3">
                    Join Nova and start exploring.
                </p>

            </div>


            <!-- SIGN UP CARD -->
            <article class="bg-white rounded-2xl shadow-lg
                        border border-slate-200 p-8">

                <form class="space-y-5">

                    <!-- Full Name -->
                    <div>
                        <label for="name"
                               class="block text-sm font-semibold mb-2">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            required
                            class="w-full px-4 py-3 rounded-lg
                                   border border-slate-300
                                   focus:outline-none
                                   focus:ring-2 focus:ring-indigo-500">
                    </div>


                    <!-- Email -->
                    <div>
                        <label for="email"
                               class="block text-sm font-semibold mb-2">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                            class="w-full px-4 py-3 rounded-lg
                                   border border-slate-300
                                   focus:outline-none
                                   focus:ring-2 focus:ring-indigo-500">
                    </div>


                    <!-- Password -->
                    <div>
                        <label for="password"
                               class="block text-sm font-semibold mb-2">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required
                            class="w-full px-4 py-3 rounded-lg
                                   border border-slate-300
                                   focus:outline-none
                                   focus:ring-2 focus:ring-indigo-500">
                    </div>


                    <!-- Confirm Password -->
                    <div>
                        <label for="confirm-password"
                               class="block text-sm font-semibold mb-2">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Confirm your password"
                            required
                            class="w-full px-4 py-3 rounded-lg
                                   border border-slate-300
                                   focus:outline-none
                                   focus:ring-2 focus:ring-indigo-500">
                    </div>


                    <!-- Terms -->
                    <div class="flex items-start gap-3">

                        <input
                            type="checkbox"
                            id="terms"
                            required
                            class="w-4 h-4 mt-1 accent-indigo-600">

                        <label for="terms"
                               class="text-sm text-slate-600">
                            I agree to the
                            <a href="#"
                               class="text-indigo-600 font-medium">
                                Terms & Conditions
                            </a>
                        </label>

                    </div>


                    <!-- Button -->
                    <button
                        type="submit"
                        class="w-full bg-indigo-600 text-white
                               py-3 rounded-lg font-semibold
                               hover:bg-indigo-700 transition">
                        Create Account
                    </button>

                </form>


                <!-- Divider -->
                <div class="flex items-center gap-4 my-7">

                    <div class="h-px bg-slate-200 flex-1"></div>

                    <span class="text-sm text-slate-500">
                        OR
                    </span>

                    <div class="h-px bg-slate-200 flex-1"></div>

                </div>


                <!-- Google Button -->
                <button
                    class="w-full border border-slate-300
                           py-3 rounded-lg font-semibold
                           hover:bg-slate-50 transition">
                    Continue with Google
                </button>


                <!-- Sign In -->
                <p class="text-center text-sm text-slate-600 mt-7">

                    Already have an account?

                    <a href="signin.html"
                       class="text-indigo-600 font-semibold
                              hover:text-indigo-700">
                        Sign In
                    </a>

                </p>

            </article>

        </div>

    </main>


    <!-- FOOTER -->

        <div class="max-w-7xl mx-auto px-6 py-10">

            <div class="flex flex-col md:flex-row

                        NOVA

                        Simple. Modern. Digital.
                    </p>
                </div>

                <div class="flex gap-6 text-sm">

                    <a href="../../index.html"
                       class="hover:text-white transition">
                        Home
                    </a>

                    <a href="about.html"
                       class="hover:text-white transition">
                        About
                    </a>

                    <a href="contact.html"
                       class="hover:text-white transition">
                        Contact
                    </a>

                </div>

            </div>

            <div class="border-t border-slate-800 mt-8 pt-6 text-center">

                <p class="text-sm text-slate-500">
                    © 2026 Nova. All rights reserved.
                </p>

            </div>

        </div>

    </footer>

</body>
